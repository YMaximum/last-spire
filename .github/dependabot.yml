version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies]
    # Match the deployed Node 22 API; change this with a reviewed runtime migration.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      compatible-npm-updates:
        patterns: ['*']
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ['*']
