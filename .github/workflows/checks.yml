name: Source checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: last-spire-checks
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'YMaximum/last-spire' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, last-spire]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:public
      - run: npm test -- --maxWorkers=1 --reporter=dot
      - run: python3 -m unittest discover -s hosting/tests -v
      - run: npm run build
      - name: Package merged main release
        if: github.ref == 'refs/heads/main'
        run: node scripts/package-release.mjs
      - name: Upload checked release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: last-spire-${{ github.sha }}
          path: .release/*
          if-no-files-found: error
          retention-days: 30
