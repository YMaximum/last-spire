name: Source checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: last-spire-checks
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'YMaximum/last-spire' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, last-spire]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run check:public
      - run: npm test -- --maxWorkers=1 --reporter=dot
      - run: python3 -m unittest discover -s hosting/tests -v
      - run: npm run build
      - run: npm run check:secrets
      - name: Package merged main release
        if: github.ref == 'refs/heads/main'
        run: node scripts/package-release.mjs
      - name: Report release handoff
        if: github.ref == 'refs/heads/main'
        run: echo 'The trusted VPS controller collects this checked release only after the workflow succeeds. Publishing remains a separate SSH command.'
